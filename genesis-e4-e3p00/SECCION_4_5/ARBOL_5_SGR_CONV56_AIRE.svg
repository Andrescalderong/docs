<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 736" width="1054" height="736" role="img" aria-labelledby="titulo desc" data-mdr="3.0" data-arbol="A-PROB" data-tipo-arbol="5">
<title id="titulo">A-PROB: árbol de problemas de la vigilancia de material particulado en sitios de remoción de escombros</title>
<desc id="desc">Árbol de problemas con diez nodos y diez relaciones en cinco niveles. El problema central es el error de medición sin verificar frente a una referencia (V06). Las causas directas son humedad, PM10, PM2,5 y frecuencia de calibración. La causa indirecta es la remoción de escombros. Los efectos son un índice sin fórmula local, falsas alarmas sin medir, baja adopción institucional y personas sin protección efectiva. Todas las relaciones son hipótesis de influencia estructural sin efecto estimado.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A3439" /></marker></defs>
<g id="encabezado"><text x="30.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2A3439" text-anchor="start"><tspan x="30.0" dy="0">A-PROB: árbol de problemas de la vigilancia de material particulado en sitios de remoción de escombros</tspan></text><text x="30.0" y="52.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#2A3439" text-anchor="start"><tspan x="30.0" dy="0">Árbol 5 · Árbol de problemas · Naturaleza: PROPUESTO · Fuente: Sección 4.4 (S2), 4.4-MDR y E3-P00 a E3-P21; relaciones con estatuto HIE</tspan></text><text x="30.0" y="71.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#2A3439" text-anchor="start"><tspan x="30.0" dy="0">Pregunta: ¿Qué estados problemáticos, causas y efectos sustentan el error de medición sin verificar como problema central?</tspan></text></g>
