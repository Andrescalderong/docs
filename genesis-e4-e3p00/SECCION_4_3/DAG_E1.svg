<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" role="img" font-family="DejaVu Sans, Arial, sans-serif">
<title>DAG principal del estimando E1: efecto del método de corrección sobre el error de medición</title>
<desc>Grafo dirigido por nodo-semana. El sorteo semanal asigna X. Los controles V01 a V04 afectan Y. V05 afecta V01, V02 y V09. V08 y V09 descienden de X. V11 y V12 descienden de Y y afectan V15. La flecha de V15 hacia X es una retroalimentación que rompe la aciclicidad si X no es aleatorizado. Los nodos latentes afectan Y.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2A3439"/></marker></defs>
<text x="30" y="28" font-size="16" fill="#2A3439" font-weight="bold">DAG principal del estimando E1 (4.3.4)</text>
<text x="30" y="48" font-size="11" fill="#2A3439">Trazo continuo: relación dirigida. Trazo discontinuo: retroalimentación o amenaza de identificación. Escenario S2 y diseño del informe_FINAL, sección 11.</text>
